# slam_toolbox online_async (mapping) for the Create 3 + LDROBOT LD19 LiDAR.
# The node is called `slam_toolbox` (launched as async_slam_toolbox_node with name='slam_toolbox').
# The comments explain the parameters that are tweaked most often; the rest are reasonable defaults.
slam_toolbox:
  ros__parameters:
    # Solver (Ceres): optimizes the pose graph. It is rarely touched.
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS: frames and topics
    odom_frame: odom          # published by the Create 3
    map_frame: map            # published by slam_toolbox (map -> odom)
    base_frame: base_link
    scan_topic: scan          # relative: /<ns>/scan (the scan_resampler output)
    mode: mapping             # mapping (not localization): the robot keeps extending the map

    debug_logging: false
    throttle_scan: 1          # the LD19 gives ~10 Hz; every scan is processed (raise it if the Pi CPU saturates)
    transform_publish_period: 0.02
    map_update_interval: 2.0  # s between updates of the published map
    resolution: 0.05          # m per cell
    # LD19 range according to the datasheet: 0.03-12 m. max_laser_range is set to the sensor limit:
    # a larger value would only add noise.
    max_laser_range: 12.0
    # Ignore returns from the robot itself / the LD19 housing (the sensor sits on top of the lid).
    min_laser_range: 0.10
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000   # bytes; needed to serialize large pose graphs
    enable_interactive_mode: false

    # General parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2    # m between processed scans (small for a robot with a 0.17 m radius)
    minimum_travel_heading: 0.2     # rad (~11 degrees)
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation for loop closure
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan matcher
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
