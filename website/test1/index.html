<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MaterialenBuddy</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; }
      button { display: block; width: 100%; margin: 10px 0; padding: 14px; font-size: 1rem; cursor: pointer; }
      #status { margin-top: 24px; padding: 16px; background: #f1f5f9; border-radius: 6px; }
      .error { color: #b91c1c; }
    </style>
  </head>
  <body>
    <h1>MaterialenBuddy</h1>
    <p>Choose a destination for the Create 3.</p>
    <main id="locations">Loading locations...</main>
    <div id="status" aria-live="polite">No navigation started yet.</div>

    <script>
      const locationsElement = document.querySelector("#locations");
      const statusElement = document.querySelector("#status");

      async function loadLocations() {
        const response = await fetch("/locations");
        if (!response.ok) throw new Error("Locations could not be loaded.");
        const locations = await response.json();
        locationsElement.replaceChildren(...locations.map((location) => {
          const button = document.createElement("button");
          button.textContent = location.name;
          button.addEventListener("click", () => navigate(location.id));
          return button;
        }));
      }

      async function navigate(locationId) {
        statusElement.className = "";
        statusElement.textContent = "Starting navigation...";
        try {
          const response = await fetch("/navigate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ location_id: locationId }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.detail || "Navigation failed.");
          statusElement.textContent = result.message;
          pollStatus(result.job_id);
        } catch (error) {
          statusElement.textContent = error.message;
          statusElement.className = "error";
        }
      }

      async function pollStatus(jobId) {
        const response = await fetch(`/status/${jobId}`);
        const result = await response.json();
        statusElement.textContent = result.message;
        if (result.status === "en route") window.setTimeout(() => pollStatus(jobId), 300);
      }

      loadLocations().catch((error) => {
        statusElement.textContent = error.message;
        statusElement.className = "error";
      });
    </script>
  </body>
</html>
